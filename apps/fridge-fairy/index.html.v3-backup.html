<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🧚 음식요정 V3</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:"Malgun Gothic","Noto Sans KR",sans-serif;
 background:linear-gradient(135deg,#dff8ff,#f5e7ff);
 color:#263238;
}

.app{
 max-width:1100px;
 margin:auto;
 padding:16px;
}

header,.card{
 background:white;
 border-radius:26px;
 box-shadow:0 8px 25px #0001;
}

header{
 padding:24px;
 text-align:center;
}

.fairy{
 font-size:65px;
}

h1{
 margin:4px 0;
 font-size:34px;
}

header p{
 color:#777;
}

.home{
 display:inline-block;
 padding:10px 16px;
 border-radius:14px;
 background:#eeeeee;
 color:#333;
 text-decoration:none;
 font-weight:bold;
}

.card{
 padding:20px;
 margin-top:18px;
}

button{
 border:0;
 border-radius:14px;
 padding:12px 16px;
 margin:4px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 background:#7c4dff;
 color:white;
}

button:active{
 transform:scale(.97);
}

.green{background:#43a047}
.red{background:#ef5350}
.blue{background:#2196f3}
.orange{background:#fb8c00}
.pink{background:#ec407a}

input,select{
 width:100%;
 padding:13px;
 border:2px solid #eee;
 border-radius:13px;
 font-size:16px;
 margin:6px 0 12px;
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

/* =========================
   냉장고 + 식품 서랍
========================= */

.storage-area{
 display:grid;
 grid-template-columns:1.55fr 1fr;
 gap:18px;
 align-items:stretch;
}

.fridge{
 min-height:520px;
 border:8px solid #90a4ae;
 border-radius:32px;
 background:
 linear-gradient(90deg,#e8f5f9,#ffffff 25%,#eef8fb 50%,#ffffff 75%,#e8f5f9);
 padding:14px;
 position:relative;
 box-shadow:inset 0 0 20px #90a4ae55;
}

.fridge-top{
 height:55px;
 border-radius:18px;
 background:linear-gradient(#fafafa,#e4edf0);
 border:2px solid #cfd8dc;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:23px;
 font-weight:bold;
}

.fridge-light{
 position:absolute;
 width:12px;
 height:12px;
 background:#ef5350;
 border-radius:50%;
 right:25px;
 top:24px;
}

.fridge-section{
 margin-top:12px;
 border:3px solid #cfd8dc;
 border-radius:18px;
 background:#ffffffaa;
 padding:10px;
 min-height:180px;
}

.section-title{
 font-size:14px;
 font-weight:bold;
 color:#607d8b;
 margin-bottom:8px;
}

.shelf-line{
 height:5px;
 background:#cfd8dc;
 border-radius:5px;
 margin:9px 0;
}

.drawer{
 min-height:520px;
 border-radius:30px;
 padding:15px;
 background:
 linear-gradient(135deg,#d19a67,#e8bd88 50%,#c98d58);
 box-shadow:
 inset 0 0 0 7px #a86f40,
 inset 0 0 30px #70452255,
 0 8px 15px #0002;
}

.drawer-front{
 background:#8d5a32;
 color:white;
 border-radius:18px;
 padding:14px;
 text-align:center;
 font-size:22px;
 font-weight:bold;
 box-shadow:inset 0 -5px 0 #704522;
}

.drawer-handle{
 width:100px;
 height:10px;
 border-radius:10px;
 background:#704522;
 margin:12px auto 18px;
 box-shadow:0 2px 4px #0004;
}

.drawer-inside{
 min-height:400px;
 background:#e7b77d;
 border-radius:20px;
 padding:12px;
 border:4px solid #b87b45;
 box-shadow:inset 0 0 25px #70452255;
}

.food-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}

.drawer .food-grid{
 grid-template-columns:repeat(2,1fr);
}

.food{
 background:white;
 border:2px solid #e0e0e0;
 border-radius:17px;
 padding:11px;
 min-height:180px;
 box-shadow:0 4px 10px #0001;
}

.food-icon{
 font-size:38px;
 text-align:center;
}

.food-name{
 font-size:17px;
 font-weight:bold;
 text-align:center;
 margin-top:4px;
 word-break:keep-all;
}

.amount{
 text-align:center;
 margin:6px 0;
}

.badge{
 display:block;
 width:max-content;
 max-width:100%;
 margin:6px auto;
 padding:5px 8px;
 border-radius:9px;
 font-size:12px;
 font-weight:bold;
}

.fresh{
 background:#d9f7df;
 color:#218838;
}

.soon{
 background:#fff0c2;
 color:#a56b00;
}

.danger{
 background:#ffdada;
 color:#c62828;
}

.food-buttons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
}

.food-buttons button{
 font-size:12px;
 padding:8px 9px;
}

.empty{
 text-align:center;
 color:#777;
 padding:35px 10px;
}

/* =========================
   카메라
========================= */

.camera-box{
 background:#f7f3ff;
 border:3px dashed #b39ddb;
 border-radius:20px;
 padding:16px;
 text-align:center;
}

video{
 width:100%;
 max-height:400px;
 border-radius:18px;
 background:#222;
 object-fit:cover;
}

#preview{
 display:none;
 width:100%;
 max-height:400px;
 object-fit:contain;
 border-radius:18px;
 margin-top:10px;
}

.status{
 display:none;
 background:#ede7f6;
 padding:13px;
 border-radius:14px;
 margin-top:10px;
 font-weight:bold;
}

/* =========================
   레시피
========================= */

.recipe{
 margin-top:12px;
 padding:16px;
 background:#fff8e1;
 border-radius:18px;
 border:2px solid #ffe082;
}

.recipe-ok{
 color:#2e7d32;
 font-weight:bold;
}

.recipe-no{
 color:#c62828;
 font-weight:bold;
}

@media(max-width:750px){

 .storage-area{
   grid-template-columns:1fr;
 }

 .food-grid{
   grid-template-columns:repeat(2,1fr);
 }

 .drawer .food-grid{
   grid-template-columns:repeat(2,1fr);
 }

 .form-grid{
   grid-template-columns:1fr;
 }

 h1{
   font-size:28px;
 }
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="fairy">🧚‍♀️</div>

<h1>음식요정 V3</h1>

<p>
내가 가지고 있는 음식과 유통기한을 관리해요!
</p>

<a class="home" href="../../index.html">
🏠 메인으로
</a>

</header>


<!-- =========================
     음식 추가
========================= -->

<div class="card">

<h2>➕ 음식 추가</h2>

<label>음식 이름</label>
<input id="foodName" placeholder="예: 계란, 참기름, 라면">

<div class="form-grid">

<div>
<label>수량</label>
<input id="foodAmount" type="number" min="1" value="1">
</div>

<div>
<label>유통기한</label>
<input id="expiry" type="date">
</div>

</div>

<label>보관 위치</label>

<select id="location">

<option>🧊 냉장실</option>
<option>❄️ 냉동실</option>
<option>🚪 냉장고 문</option>
<option>🗄️ 식품 서랍</option>

</select>

<button onclick="addFood()">
➕ 음식 넣기
</button>

</div>


<!-- =========================
     카메라
========================= -->

<div class="card">

<h2>📷 음식 카메라</h2>

<p>
카메라로 음식을 찍어보세요.
</p>

<div class="camera-box">

<video id="camera" autoplay playsinline></video>

<canvas id="canvas" style="display:none"></canvas>

<img id="preview">

<div>

<button class="blue" onclick="startCamera()">
📷 카메라 켜기
</button>

<button class="pink" onclick="takePhoto()">
📸 음식 찍기
</button>

<button class="red" onclick="stopCamera()">
⏹️ 끄기
</button>

</div>

<div id="cameraStatus" class="status"></div>

</div>

<div id="manualBox"
style="display:none;margin-top:15px;background:#fff8e1;padding:16px;border-radius:18px">

<h3>✏️ 직접 적어도 돼요!</h3>

<p>
음식을 알아보지 못했어요.<br>
괜찮아요. 직접 음식 이름을 적어주세요. 😊
</p>

<input id="manualName" placeholder="예: 참기름">

<div class="form-grid">

<div>
<label>수량</label>
<input id="manualAmount" type="number" min="1" value="1">
</div>

<div>
<label>유통기한</label>
<input id="manualExpiry" type="date">
</div>

</div>

<select id="manualLocation">
<option>🧊 냉장실</option>
<option>❄️ 냉동실</option>
<option>🚪 냉장고 문</option>
<option>🗄️ 식품 서랍</option>
</select>

<button class="pink" onclick="addManualFood()">
➕ 직접 음식 추가
</button>

</div>

</div>


<!-- =========================
     냉장고 + 서랍
========================= -->

<div class="card">

<div style="display:flex;align-items:center;gap:10px">

<h2 style="margin-right:auto">
🏠 나의 음식 보관함
</h2>

<button class="green" onclick="organizeFood()">
🧹 냉장고 정리
</button>

</div>


<div class="storage-area">

<!-- 냉장고 -->

<div class="fridge">

<div class="fridge-light"></div>

<div class="fridge-top">
🧊 냉장고
</div>

<div class="fridge-section">

<div class="section-title">
❄️ 냉동실 / 냉장실
</div>

<div id="fridgeList" class="food-grid"></div>

</div>

<div class="fridge-section">

<div class="section-title">
🚪 냉장고 문
</div>

<div id="doorList" class="food-grid"></div>

</div>

</div>


<!-- 식품 서랍 -->

<div class="drawer">

<div class="drawer-front">
🗄️ 식품 서랍
</div>

<div class="drawer-handle"></div>

<div class="drawer-inside">

<div style="text-align:center;font-size:13px;margin-bottom:10px">
🍚 상온 보관 음식
</div>

<div id="pantryList" class="food-grid"></div>

</div>

</div>

</div>

</div>


<!-- =========================
     오늘 뭐 먹지
========================= -->

<div class="card">

<h2>🍳 오늘 뭐 먹지?</h2>

<p>
현재 가지고 있는 음식과 유통기한을 확인해서
<strong>실제로 만들 수 있는 메뉴만</strong> 알려줘요.
</p>

<button class="orange" onclick="recommendFood()">
🍳 오늘 메뉴 추천
</button>

<div id="recipeResult"></div>

</div>

</div>


<script>

/* =========================
   데이터
========================= */

let data =
JSON.parse(localStorage.getItem("foodFairyV3"))
||
{
 foods:[]
};

function save(){

 localStorage.setItem(
   "foodFairyV3",
   JSON.stringify(data)
 );

}


/* =========================
   날짜
========================= */

function daysLeft(date){

 if(!date)return 9999;

 const today=new Date();

 today.setHours(0,0,0,0);

 const target=
   new Date(date+"T00:00:00");

 return Math.ceil(
   (target-today)/86400000
 );
}


function status(days){

 if(days<0)
   return {
    text:"유통기한 지남",
    cls:"danger"
   };

 if(days===0)
   return {
    text:"오늘까지",
    cls:"danger"
   };

 if(days<=3)
   return {
    text:"D-"+days,
    cls:"soon"
   };

 return {
   text:"D-"+days,
   cls:"fresh"
 };
}


/* =========================
   아이콘
========================= */

function icon(name){

 const n=name.replace(/\s/g,"");

 if(n.includes("계란")||n.includes("달걀"))return"🥚";
 if(n.includes("우유"))return"🥛";
 if(n.includes("참기름"))return"🫙";
 if(n.includes("간장"))return"🧂";
 if(n.includes("밥")||n.includes("쌀"))return"🍚";
 if(n.includes("라면"))return"🍜";
 if(n.includes("김치"))return"🥬";
 if(n.includes("사과"))return"🍎";
 if(n.includes("바나나"))return"🍌";
 if(n.includes("딸기"))return"🍓";
 if(n.includes("토마토"))return"🍅";
 if(n.includes("감자"))return"🥔";
 if(n.includes("양파"))return"🧅";
 if(n.includes("당근"))return"🥕";
 if(n.includes("빵"))return"🍞";
 if(n.includes("치즈"))return"🧀";
 if(n.includes("고기"))return"🥩";
 if(n.includes("닭"))return"🍗";

 return"🥫";
}


function escapeHTML(text){

 return String(text).replace(
   /[&<>"']/g,
   function(m){

     return {
       "&":"&amp;",
       "<":"&lt;",
       ">":"&gt;",
       '"':"&quot;",
       "'":"&#039;"
     }[m];

   }
 );

}


/* =========================
   음식 추가
========================= */

function addFoodObject(
 name,
 amount,
 location,
 expiry
){

 name=name.trim();

 if(!name){
   alert("음식 이름을 적어주세요!");
   return false;
 }

 if(!expiry){
   alert("유통기한을 선택해주세요!");
   return false;
 }

 data.foods.push({

   id:Date.now()+Math.random(),

   name:name,

   amount:Math.max(
     1,
     Number(amount)||1
   ),

   location:location,

   expiry:expiry

 });

 save();
 renderFoods();

 return true;
}


function addFood(){

 const name=
 document.getElementById("foodName").value;

 const amount=
 document.getElementById("foodAmount").value;

 const location=
 document.getElementById("location").value;

 const expiry=
 document.getElementById("expiry").value;

 if(
   addFoodObject(
     name,
     amount,
     location,
     expiry
   )
 ){

   document.getElementById("foodName").value="";

   alert(
     "🥕 "+
     name+
     "을(를) 추가했어요!"
   );

 }

}


function addManualFood(){

 const name=
 document.getElementById("manualName").value;

 const amount=
 document.getElementById("manualAmount").value;

 const location=
 document.getElementById("manualLocation").value;

 const expiry=
 document.getElementById("manualExpiry").value;

 if(
   addFoodObject(
     name,
     amount,
     location,
     expiry
   )
 ){

   document.getElementById("manualName").value="";

   document.getElementById("manualBox").style.display="none";

   cameraMessage(
     "✅ 직접 입력한 음식이 추가됐어요!"
   );

 }

}


/* =========================
   음식 먹기
========================= */

function eatOne(id){

 const food=
 data.foods.find(
   f=>f.id===id
 );

 if(!food)return;

 if(food.amount<=0){

   alert("😋 이 음식은 다 먹었어요!");

   return;
 }

 food.amount--;

 save();
 renderFoods();

 if(food.amount===0){

   alert(
     "🍽️ "+
     food.name+
     "을(를) 다 먹었어요!"
   );

 }

}


/* =========================
   삭제
========================= */

function deleteFood(id){

 const food=
 data.foods.find(
   f=>f.id===id
 );

 if(!food)return;

 if(
   !confirm(
     "🗑️ "+
     food.name+
     "을(를) 삭제할까요?"
   )
 )return;

 data.foods=
 data.foods.filter(
   f=>f.id!==id
 );

 save();
 renderFoods();

}


/* =========================
   자동 정리
========================= */

function organizeFood(){

 data.foods.sort(
   (a,b)=>
   daysLeft(a.expiry)-
   daysLeft(b.expiry)
 );

 save();
 renderFoods();

 alert(
   "🧹 정리 완료!\n\n"+
   "유통기한이 가까운 음식부터 정리했어요."
 );

}


/* =========================
   음식 카드
========================= */

function foodCard(food){

 const s=
 status(daysLeft(food.expiry));

 return `

 <div class="food">

   <div class="food-icon">
     ${icon(food.name)}
   </div>

   <div class="food-name">
     ${escapeHTML(food.name)}
   </div>

   <div class="amount">
     📦 ${food.amount}개
   </div>

   <span class="badge ${s.cls}">
     ${s.text}
   </span>

   <div style="text-align:center;font-size:12px">
     📅 ${escapeHTML(food.expiry)}
   </div>

   <div class="food-buttons">

     <button
       class="green"
       onclick="eatOne(${food.id})">
       🍽️ 1개 먹음
     </button>

     <button
       class="red"
       onclick="deleteFood(${food.id})">
       🗑️ 삭제
     </button>

   </div>

 </div>

 `;

}


/* =========================
   음식 표시
========================= */

function renderGroup(box,foods,message){

 if(foods.length===0){

   box.innerHTML=
     '<div class="empty">'+
     message+
     '</div>';

   return;
 }

 box.innerHTML=
   foods
   .map(foodCard)
   .join("");

}


function renderFoods(){

 const fridge=
 document.getElementById("fridgeList");

 const door=
 document.getElementById("doorList");

 const pantry=
 document.getElementById("pantryList");


 const foods=
 data.foods.filter(
   f=>f.amount>0
 );


 const fridgeFoods=
 foods.filter(
   f=>
   f.location==="🧊 냉장실" ||
   f.location==="❄️ 냉동실"
 );


 const doorFoods=
 foods.filter(
   f=>
   f.location==="🚪 냉장고 문"
 );


 const pantryFoods=
 foods.filter(
   f=>
   f.location==="🗄️ 식품 서랍"
 );


 renderGroup(
   fridge,
   fridgeFoods,
   "냉장고가 비어 있어요 🧊"
 );


 renderGroup(
   door,
   doorFoods,
   "냉장고 문이 비어 있어요 🚪"
 );


 renderGroup(
   pantry,
   pantryFoods,
   "식품 서랍이 비어 있어요 🗄️"
 );

}


/* =========================
   카메라
========================= */

let stream=null;


async function startCamera(){

 try{

   stream=
   await navigator.mediaDevices
   .getUserMedia({

     video:{
       facingMode:{
         ideal:"environment"
       }
     },

     audio:false

   });

   document.getElementById(
     "camera"
   ).srcObject=stream;

   cameraMessage(
     "📷 카메라가 켜졌어요! 음식을 보여주세요."
   );

 }

 catch(error){

   console.log(error);

   cameraMessage(
     "⚠️ 카메라를 사용할 수 없어요."
   );

   document.getElementById(
     "manualBox"
   ).style.display="block";

 }

}


function stopCamera(){

 if(stream){

   stream.getTracks()
   .forEach(
     track=>track.stop()
   );

   stream=null;

 }

 document.getElementById(
   "camera"
 ).srcObject=null;

}


function takePhoto(){

 if(!stream){

   alert(
     "먼저 📷 카메라 켜기를 눌러주세요!"
   );

   return;
 }

 const video=
 document.getElementById("camera");

 const canvas=
 document.getElementById("canvas");

 canvas.width=
 video.videoWidth;

 canvas.height=
 video.videoHeight;

 const ctx=
 canvas.getContext("2d");

 ctx.drawImage(
   video,
   0,
   0,
   canvas.width,
   canvas.height
 );

 const image=
 canvas.toDataURL(
   "image/jpeg",
   .85
 );

 document.getElementById(
   "preview"
 ).src=image;

 document.getElementById(
   "preview"
 ).style.display="block";


 /*
   현재 단계:
   사진 촬영 성공.

   다음 단계:
   이 image 데이터를
   AI 서버로 보내서
   음식 이름을 자동 인식.
 */

 cameraMessage(
   "📸 사진을 찍었어요!\n"+
   "AI 음식 인식 연결 전이라면 직접 적어도 돼요. 😊"
 );

 document.getElementById(
   "manualBox"
 ).style.display="block";

}


function cameraMessage(text){

 const box=
 document.getElementById(
   "cameraStatus"
 );

 box.style.display="block";
 box.textContent=text;

}


/* =========================
   실제 음식 재료 확인
========================= */

function hasFood(required){

 return data.foods.some(
   food=>
   food.amount>0 &&
   food.name
   .replace(/\s/g,"")
   .includes(
     required
     .replace(/\s/g,"")
   )
 );

}


/* =========================
   레시피
========================= */

const recipes=[

 {
   name:"🍳 간장계란밥",

   required:[
     "밥",
     "계란",
     "간장",
     "참기름"
   ]
 },

 {
   name:"🍅 토마토 계란볶음",

   required:[

function recommendFood(){

 const box=
 document.getElementById(
   "recipeResult"
 );

 let html="";

 recipes.forEach(recipe=>{

   const missing=
   recipe.required.filter(
     item=>!hasFood(item)
   );

   html+=
   '<div class="recipe">'+

   '<h3>'+
   recipe.name+
   '</h3>';

   recipe.required.forEach(item=>{

     const ok=
     hasFood(item);

     html+=
     '<div class="'+
     (ok
       ?"recipe-ok"
       :"recipe-no")+
     '">'+

     (ok?"✅ ":"❌ ")+
     escapeHTML(item)+

     '</div>';

   });


   if(missing.length===0){

     html+=
     '<p class="recipe-ok">'+
     '🎉 지금 가지고 있는 재료로 만들 수 있어요!'+
     '</p>';

   }else{

     html+=
     '<p class="recipe-no">'+
     '⚠️ 부족한 재료: '+
     missing
     .map(escapeHTML)
     .join(", ")+
     '</p>';

   }

   html+='</div>';

 });

 box.innerHTML=html;

}

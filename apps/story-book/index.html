<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>📚 꼬마 이야기책 V3</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    background:#f5f3ff;
    color:#302b3d;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#8e7dff,#b99cff);
    color:white;
    padding:22px 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 16px rgba(80,60,120,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.subtitle{
    margin-top:5px;
    opacity:.9;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:14px;
}

.search-box input{
    flex:1;
    padding:15px 17px;
    border:2px solid #e5defb;
    border-radius:18px;
    outline:none;
    background:white;
}

.search-box input:focus{
    border-color:#9b89ff;
}

.filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
}

.filter{
    white-space:nowrap;
    background:white;
    border:2px solid #e7e0fb;
    padding:10px 15px;
    border-radius:999px;
}

.filter.active{
    background:#8e7dff;
    color:white;
    border-color:#8e7dff;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:15px 0;
}

.stat{
    background:white;
    border-radius:18px;
    padding:13px;
    text-align:center;
    box-shadow:0 3px 12px rgba(60,40,100,.07);
}

.stat-number{
    font-size:22px;
    font-weight:900;
}

.stat-label{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.story-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.story-card{
    background:white;
    border-radius:22px;
    padding:16px;
    box-shadow:0 4px 16px rgba(60,40,100,.08);
    transition:.15s;
    border:2px solid transparent;
}

.story-card:hover{
    transform:translateY(-2px);
    border-color:#dcd3ff;
}

.cover{
    height:145px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    margin-bottom:13px;
    background:linear-gradient(135deg,#eee8ff,#f9efff);
}

.story-title{
    font-size:18px;
    font-weight:900;
}

.story-desc{
    color:#777;
    font-size:13px;
    line-height:1.55;
    min-height:42px;
    margin-top:7px;
}

.card-buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.primary{
    flex:1;
    background:#8e7dff;
    color:white;
    padding:11px;
    border-radius:13px;
    font-weight:800;
}

.secondary{
    background:#f0edff;
    color:#6656bd;
    padding:11px 13px;
    border-radius:13px;
}

.favorite-btn{
    background:#fff0f5;
    color:#e65b85;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.reader{
    max-width:850px;
    margin:auto;
}

.reader-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.back-btn{
    background:white;
    padding:11px 15px;
    border-radius:13px;
}

.reader-title{
    font-weight:900;
    font-size:18px;
}

.reader-tools{
    display:flex;
    gap:7px;
}

.tool-btn{
    background:white;
    padding:10px 12px;
    border-radius:12px;
}

.book{
    background:#fffdf7;
    min-height:600px;
    border-radius:25px;
    padding:45px 42px;
    box-shadow:0 8px 30px rgba(60,40,100,.12);
    position:relative;
}

.book-cover{
    text-align:center;
}

.book-cover .emoji{
    font-size:90px;
}

.book-cover h1{
    font-size:34px;
    margin:20px 0 10px;
}

.book-cover p{
    color:#777;
    line-height:1.7;
}

.chapter{
    color:#8e7dff;
    font-size:14px;
    font-weight:900;
    margin-bottom:12px;
}

.reader-page-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:22px;
}

.reader-text{
    font-size:19px;
    line-height:2.05;
    color:#403b48;
}

.progress-wrap{
    margin-top:16px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    color:#777;
    font-size:13px;
    margin-bottom:6px;
}

.progress{
    height:9px;
    background:#e8e4ef;
    border-radius:99px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#8e7dff;
    transition:.2s;
}

.reader-nav{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.reader-nav button{
    flex:1;
    padding:15px;
    border-radius:16px;
    font-weight:900;
}

.prev{
    background:white;
}

.next{
    background:#8e7dff;
    color:white;
}

.complete{
    text-align:center;
    padding:30px 10px;
}

.complete-badge{
    font-size:70px;
}

.complete h2{
    color:#6d5bd0;
}

.form-box{
    background:white;
    border-radius:22px;
    padding:20px;
    box-shadow:0 4px 18px rgba(60,40,100,.08);
}

.form-box label{
    display:block;
    margin:14px 0 7px;
    font-weight:800;
}

.form-box input,
.form-box textarea{
    width:100%;
    padding:13px;
    border:2px solid #e4def4;
    border-radius:13px;
    outline:none;
}

.form-box textarea{
    min-height:120px;
    resize:vertical;
}

.add-page{
    margin-top:10px;
    background:#eeeaff;
    color:#6353b8;
    padding:11px 15px;
    border-radius:12px;
}

.custom-page{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.custom-page textarea{
    min-height:80px;
}

.delete-page{
    background:#ffecef;
    color:#d85b76;
    width:42px;
    border-radius:12px;
}

.save-story{
    width:100%;
    margin-top:16px;
    padding:15px;
    background:#8e7dff;
    color:white;
    border-radius:15px;
    font-weight:900;
}

.empty{
    background:white;
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    color:#777;
}

.notice{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#302b3d;
    color:white;
    padding:13px 18px;
    border-radius:999px;
    display:none;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.night{
    background:#171522;
    color:#eee;
}

.night header{
    background:#292440;
}

.night .story-card,
.night .stat,
.night .form-box,
.night .search-box input,
.night .filter,
.night .back-btn,
.night .tool-btn,
.night .prev,
.night .empty{
    background:#242130;
    color:#eee;
    border-color:#39334c;
}

.night .book{
    background:#242130;
    color:#eee;
}

.night .reader-text{
    color:#e7e3ee;
}

.night .story-desc,
.night .stat-label,
.night .progress-info{
    color:#aaa;
}

.big-text .reader-text{
    font-size:23px;
}

.small-text .reader-text{
    font-size:16px;
}

@media(max-width:850px){
    .story-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .logo{
        font-size:23px;
    }

    .container{
        padding:12px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .story-grid{
        grid-template-columns:1fr;
    }

    .cover{
        height:125px;
    }

    .book{
        min-height:550px;
        padding:28px 21px;
    }

    .book-cover h1{
        font-size:27px;
    }

    .reader-page-title{
        font-size:23px;
    }

    .reader-text{
        font-size:18px;
    }
}
</style>
</head>

<div class="app">

<header>
    <div class="header-inner">
        <div class="logo">📚 꼬마 이야기책 V3</div>
        <div class="subtitle">12개의 장편 이야기 · 총 1,200페이지</div>
    </div>
</header>

<main class="container">

    <!-- HOME -->
    <section id="homePage" class="page active">

        <div class="search-box">
            <input
                id="searchInput"
                placeholder="🔍 이야기 제목이나 내용을 검색해 보세요"
                oninput="renderStories()"
            >
        </div>

        <div class="filter-row">
            <button class="filter active" onclick="setFilter('all',this)">📚 전체</button>
            <button class="filter" onclick="setFilter('favorite',this)">⭐ 즐겨찾기</button>
            <button class="filter" onclick="setFilter('mine',this)">✏️ 내가 만든 이야기</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="storyCount">12</div>
                <div class="stat-label">이야기</div>
            </div>
            <div class="stat">
                <div class="stat-number">1,200</div>
                <div class="stat-label">전체 페이지</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="readCount">0</div>
                <div class="stat-label">읽은 이야기</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="favoriteCount">0</div>
                <div class="stat-label">즐겨찾기</div>
            </div>
        </div>

        <div class="card-buttons" style="margin-bottom:15px;">
            <button class="primary" onclick="showCreator()">✏️ 내 이야기 만들기</button>
            <button class="secondary" onclick="randomStory()">🎲 랜덤</button>
        </div>

        <div id="storyGrid" class="story-grid"></div>

    </section>


    <!-- READER -->
    <section id="readerPage" class="page">

        <div class="reader">

            <div class="reader-top">
                <button class="back-btn" onclick="goHome()">← 책장</button>

                <div class="reader-title" id="readerTitle"></div>

                <div class="reader-tools">
                    <button class="tool-btn" onclick="changeTextSize(-1)">A−</button>
                    <button class="tool-btn" onclick="changeTextSize(1)">A+</button>
                    <button class="tool-btn" onclick="toggleNight()">🌙</button>
                    <button class="tool-btn" onclick="speakPage()">🔊</button>
                </div>
            </div>

            <div class="book">

                <div id="readerContent"></div>

            </div>

            <div class="progress-wrap">
                <div class="progress-info">
                    <span id="progressText">1 / 100</span>
                    <span id="progressPercent">1%</span>
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="reader-nav">
                <button class="prev" onclick="previousPage()">← 이전 페이지</button>
                <button class="next" onclick="nextPage()">다음 페이지 →</button>
            </div>

        </div>

    </section>


    <!-- CREATOR -->
    <section id="creatorPage" class="page">

        <div class="form-box">

            <button class="back-btn" onclick="goHome()">← 책장으로</button>

            <h2>✏️ 나만의 이야기 만들기</h2>

            <label>이야기 제목</label>
            <input id="newTitle" placeholder="예: 달빛 고양이의 모험">

            <label>표지 이모지</label>
            <input id="newEmoji" value="📖" maxlength="4">

            <label>이야기 소개</label>
            <textarea id="newDescription"
                placeholder="어떤 이야기인지 적어 보세요"></textarea>

            <label>페이지</label>

            <div id="customPages"></div>

            <button class="add-page" onclick="addCustomPage()">
                ＋ 페이지 추가
            </button>

            <button class="save-story" onclick="saveCustomStory()">
                💾 이야기 저장하기
            </button>

        </div>

    </section>

</main>

</div>

<div class="notice" id="notice"></div>

/* =====================================
   100페이지 이야기 만들기
===================================== */

function createPages(seed){

    const pages=[];

    for(let i=0;i<100;i++){

        const n=i+1;
        const title=pageTitles[i];

        let text="";

        if(n===1){

            text=
            `${seed.hero}는 ${seed.place}에서 평소와 조금 다른 아침을 맞았다. `+
            `그날은 특별히 무언가가 시작될 것 같은 느낌이 들었다. `+
            `친구 ${seed.friend}도 같은 생각을 했는지 주변을 유심히 바라보았다. `+
            `그리고 바로 그때, ${seed.object}와 관련된 뜻밖의 흔적을 발견했다.`;

        }else if(n===100){

            text=
            `긴 여행이 끝났다. ${seed.hero}와 ${seed.friend}는 처음 출발했던 곳을 바라보며 미소를 지었다. `+
            `${seed.goal}이라는 처음의 목표는 이제 멋진 추억이 되어 있었다. `+
            `여행을 하면서 알게 된 가장 소중한 것은 특별한 물건보다 서로 믿고 함께 생각하는 마음이었다. `+
            `${seed.hero}는 언젠가 또 새로운 모험이 시작될 것이라고 생각했다. `+
            `그리고 ${seed.place}에는 오래도록 따뜻한 이야기가 남았다. `+
            `이것으로 오늘의 이야기는 끝이지만, 다음 이야기는 이제 막 시작되고 있었다.`;

        }else if(n%10===0){

            text=
            `${seed.hero}는 잠시 멈춰 지나온 길을 돌아보았다. `+
            `처음에는 모든 것이 낯설고 어렵게 느껴졌지만 ${seed.friend}와 함께 하나씩 해결해 왔다. `+
            `${situations[i%10]} `+
            `두 친구는 지금까지 모은 단서들을 다시 살펴보았다. `+
            `그러자 ${seed.object}에 관한 중요한 사실이 조금씩 드러나기 시작했다. `+
            `${actions[(i+3)%10]}`;

        }else if(n%7===0){

            text=
            `${discoveries[i%10]} `+
            `${seed.hero}는 놀라면서도 침착하게 생각했다. `+
            `친구 ${seed.friend}가 먼저 한 걸음 앞으로 나아갔다. `+
            `"우리라면 할 수 있어."라고 서로 격려했다. `+
            `두 친구는 지금까지 배운 것을 떠올리며 새로운 방법을 찾아냈다. `+
            `그리고 ${actions[(i+2)%10]}`;

        }else{

            text=
            `${situations[i%10]} `+
            `${seed.hero}는 ${seed.place}를 천천히 살펴보았다. `+
            `${seed.friend}도 곁에서 함께 단서를 찾았다. `+
            `${discoveries[(i+2)%10]} `+
            `두 친구는 잠시 이야기를 나눈 뒤 ${actions[(i+1)%10]} `+
            `조금 전보다 더 분명한 길이 보이기 시작했다. `+
            `하지만 아직 ${seed.goal}을 이루려면 해야 할 일이 남아 있었다.`;
        }

        pages.push({
            title:title,
            text:text
        });
    }

    return pages;
}


/* =====================================
   상태
===================================== */

let userStories=
    JSON.parse(localStorage.getItem("storyBookUserStories")||"[]");

let favorites=
    JSON.parse(localStorage.getItem("storyBookFavorites")||"{}");

let progress=
    JSON.parse(localStorage.getItem("storyBookProgress")||"{}");

let currentFilter="all";
let currentStory=null;
let currentPage=0;
let textSize=0;


/* =====================================
   전체 이야기
===================================== */

function getAllStories(){

    const defaults=storySeeds.map(seed=>({
        ...seed,
        pages:createPages(seed),
        mine:false
    }));

    return [...defaults,...userStories];
}


/* =====================================
   홈 화면
===================================== */

function renderStories(){

    const grid=document.getElementById("storyGrid");

    const search=
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    let stories=getAllStories();

    if(currentFilter==="favorite"){
        stories=stories.filter(s=>favorites[s.id]);
    }

    if(currentFilter==="mine"){
        stories=stories.filter(s=>s.mine);
    }

    if(search){

        stories=stories.filter(s=>{

            const text=[
                s.title,
                s.description,
                s.hero,
                s.place,
                s.friend,
                s.object,
                ...(s.pages||[]).map(p=>p.text)
            ].join(" ").toLowerCase();

            return text.includes(search);
        });
    }

    document.getElementById("storyCount").textContent=getAllStories().length;

    const readStories=
        Object.keys(progress)
        .filter(id=>progress[id]>0).length;

    document.getElementById("readCount").textContent=readStories;

    document.getElementById("favoriteCount").textContent=
        Object.values(favorites).filter(Boolean).length;

    if(stories.length===0){

        grid.innerHTML=`
        <div class="empty" style="grid-column:1/-1">
            <div style="font-size:50px">🔎</div>
            <h3>이야기를 찾지 못했어요</h3>
            <p>다른 제목이나 단어로 검색해 보세요.</p>
        </div>`;

        return;
    }

    grid.innerHTML=stories.map(story=>{

        const p=progress[story.id]||0;
        const fav=!!favorites[story.id];

        return `
        <article class="story-card">

            <div class="cover">${story.emoji}</div>

            <div class="story-title">
                ${escapeHTML(story.title)}
            </div>

            <div class="story-desc">
                ${escapeHTML(story.description)}
            </div>

            <div style="
                margin-top:8px;
                color:#8b7ba8;
                font-size:12px;
                font-weight:700;
            ">
                📖 100페이지
                ${p>0 ? " · "+p+"페이지까지 읽음" : ""}
            </div>

            <div class="card-buttons">

                <button
                    class="primary"
                    onclick="openStory('${story.id}')">
                    ${p>0 ? "▶ 이어 읽기" : "📖 읽기"}
                </button>

                <button
                    class="secondary favorite-btn"
                    onclick="toggleFavorite('${story.id}')">
                    ${fav ? "❤️" : "♡"}
                </button>

            </div>

        </article>`;
    }).join("");
}


/* =====================================
   필터
===================================== */

function setFilter(filter,button){

    currentFilter=filter;

    document.querySelectorAll(".filter")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    renderStories();
}


/* =====================================
   즐겨찾기
===================================== */

function toggleFavorite(id){

    favorites[id]=!favorites[id];

    localStorage.setItem(
        "storyBookFavorites",
        JSON.stringify(favorites)
    );

    renderStories();

    showNotice(
        favorites[id]
        ? "⭐ 즐겨찾기에 추가했어요!"
        : "즐겨찾기에서 삭제했어요."
    );
}


/* =====================================
   이야기 열기
===================================== */

function openStory(id){

    const story=getAllStories().find(s=>s.id===id);

    if(!story)return;

    currentStory=story;

    currentPage=
        Math.min(
            Math.max((progress[id]||0)-1,0),
            story.pages.length-1
        );

    document.getElementById("homePage")
        .classList.remove("active");

    document.getElementById("creatorPage")
        .classList.remove("active");

    document.getElementById("readerPage")
        .classList.add("active");

    document.getElementById("readerTitle")
        .textContent=story.title;

    renderReader();
}


/* =====================================
   독서 화면
===================================== */

function renderReader(){

    if(!currentStory)return;

    const page=currentStory.pages[currentPage];

    document.getElementById("readerContent").innerHTML=`

        <div class="chapter">
            ${currentPage+1}번째 페이지
        </div>

        <div class="reader-page-title">
            ${escapeHTML(page.title)}
        </div>

        <div class="reader-text">
            ${escapeHTML(page.text)}
        </div>
    `;

    const percent=
        Math.round(
            ((currentPage+1)/
            currentStory.pages.length)*100
        );

    document.getElementById("progressText")
        .textContent=
        `${currentPage+1} / ${currentStory.pages.length}`;

    document.getElementById("progressPercent")
        .textContent=percent+"%";

    document.getElementById("progressBar")
        .style.width=percent+"%";

    progress[currentStory.id]=currentPage+1;

    localStorage.setItem(
        "storyBookProgress",
        JSON.stringify(progress)
    );

    if(currentPage===99){

        document.getElementById("readerContent").innerHTML+=`

        <div class="complete">

            <div class="complete-badge">🏆</div>

            <h2>100페이지 완독!</h2>

            <p>
                이 이야기의 마지막 페이지까지 읽었어요.
                정말 멋진 독서 여행이었어요.
            </p>

        </div>`;
    }
}


/* =====================================
   페이지 이동
===================================== */

function nextPage(){

    if(!currentStory)return;

    if(currentPage<
       currentStory.pages.length-1){

        currentPage++;

        renderReader();

    }else{

        showNotice("🏆 이미 마지막 페이지예요!");
    }
}


function previousPage(){

    if(!currentStory)return;

    if(currentPage>0){

        currentPage--;

        renderReader();

    }else{

        showNotice("첫 번째 페이지예요.");
    }
}


/* =====================================
   홈
===================================== */

function goHome(){

    window.speechSynthesis.cancel();

    document.getElementById("readerPage")
        .classList.remove("active");

    document.getElementById("creatorPage")
        .classList.remove("active");

    document.getElementById("homePage")
        .classList.add("active");

    renderStories();
}


/* =====================================
   랜덤 이야기
===================================== */

function randomStory(){

    const stories=getAllStories();

    const story=
        stories[
            Math.floor(
                Math.random()*stories.length
            )
        ];

    openStory(story.id);
}


/* =====================================
   글자 크기
===================================== */

function changeTextSize(value){

    textSize+=value;

    textSize=Math.max(-1,Math.min(1,textSize));

    const book=document.querySelector(".book");

    book.classList.remove("big-text");
    book.classList.remove("small-text");

    if(textSize>0){
        book.classList.add("big-text");
    }

    if(textSize<0){
        book.classList.add("small-text");
    }
}


/* =====================================
   밤 읽기
===================================== */

function toggleNight(){

    document.body.classList.toggle("night");

    localStorage.setItem(
        "storyBookNight",
        document.body.classList.contains("night")
    );
}


/* =====================================
   읽어주기
===================================== */

function speakPage(){

    if(!currentStory)return;

    window.speechSynthesis.cancel();

    const page=currentStory.pages[currentPage];

    const speech=
        new SpeechSynthesisUtterance(
            page.title+". "+page.text
        );

    speech.lang="ko-KR";
    speech.rate=.9;
    speech.pitch=1;

    window.speechSynthesis.speak(speech);
}


/* =====================================
   이야기 만들기
===================================== */

function showCreator(){

    document.getElementById("homePage")
        .classList.remove("active");

    document.getElementById("readerPage")
        .classList.remove("active");

    document.getElementById("creatorPage")
        .classList.add("active");

    document.getElementById("customPages").innerHTML="";

    addCustomPage();
    addCustomPage();
}


function addCustomPage(){

    const container=
        document.getElementById("customPages");

    const number=
        container.children.length+1;

    const div=document.createElement("div");

    div.className="custom-page";

    div.innerHTML=`

        <textarea
            placeholder="${number}번째 페이지 내용을 적어 보세요"></textarea>

        <button
            class="delete-page"
            onclick="this.parentElement.remove()">
            ×
        </button>
    `;

    container.appendChild(div);
}


/* =====================================
   내 이야기 저장
===================================== */

function saveCustomStory(){

    const title=
        document.getElementById("newTitle")
        .value.trim();

    const emoji=
        document.getElementById("newEmoji")
        .value.trim() || "📖";

    const description=
        document.getElementById("newDescription")
        .value.trim() ||
        "내가 직접 만든 특별한 이야기";

    const textareas=
        document.querySelectorAll(
            "#customPages textarea"
        );

    const pages=[];

    textareas.forEach((textarea,index)=>{

        const text=textarea.value.trim();

        if(text){

            pages.push({
                title:`${index+1}번째 이야기`,
                text:text
            });
        }
    });

    if(!title){

        showNotice("이야기 제목을 입력해 주세요.");

        return;
    }

    if(pages.length===0){

        showNotice("페이지 내용을 하나 이상 적어 주세요.");

        return;
    }

    const story={
        id:"mine_"+Date.now(),
        emoji:emoji,
        title:title,
        description:description,
        hero:"나",
        place:"내가 만든 이야기 세계",
        friend:"나의 친구",
        object:"특별한 물건",
        goal:"멋진 결말 만들기",
        pages:pages,
        mine:true
    };

    userStories.push(story);

    localStorage.setItem(
        "storyBookUserStories",
        JSON.stringify(userStories)
    );

    showNotice("📚 내 이야기를 저장했어요!");

    document.getElementById("newTitle").value="";
    document.getElementById("newDescription").value="";
    document.getElementById("customPages").innerHTML="";

    goHome();
}


/* =====================================
   HTML 안전 처리
===================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================
   알림
===================================== */

let noticeTimer=null;

function showNotice(message){

    const notice=
        document.getElementById("notice");

    notice.textContent=message;
    notice.style.display="block";

    clearTimeout(noticeTimer);

    noticeTimer=setTimeout(()=>{
        notice.style.display="none";
    },1800);
}


/* =====================================
   저장된 설정 불러오기
===================================== */

function loadSettings(){

    if(
        localStorage.getItem("storyBookNight")
        ==="true"
    ){

        document.body.classList.add("night");
    }
}


/* =====================================
   시작
===================================== */

loadSettings();
renderStories();

</script>
